name: Release

# v0.1.0 のようなタグを push するか、Actions の画面からバージョンを指定して実行すると、
# setup.exe と自動更新用のパッケージを GitHub Releases に登録する（タグがなければ作られる）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "バージョン（例: 0.1.0）"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # vpk は .NET 8 向けのツールのため、.NET 10 しかない環境でも動くようにする
      DOTNET_ROLL_FORWARD: Major
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Read version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:INPUT_VERSION
          if ([string]::IsNullOrEmpty($version)) { $version = $env:REF_NAME.TrimStart("v") }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "バージョンの形式が正しくありません: $version" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test
        run: dotnet test tests/Hayabumi.Core.Tests -c Release

      # OAuth のクライアント ID はリポジトリの「変数」、Google のクライアント シークレットは「シークレット」から埋め込む
      - name: Publish
        env:
          OAUTH_GOOGLE_CLIENT_ID: ${{ vars.OAUTH_GOOGLE_CLIENT_ID }}
          OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          OAUTH_MICROSOFT_CLIENT_ID: ${{ vars.OAUTH_MICROSOFT_CLIENT_ID }}
        run: >
          dotnet publish src/Hayabumi.App -c Release -o publish
          -p:Version=${{ env.VERSION }}
          -p:OAuthGoogleClientId="$env:OAUTH_GOOGLE_CLIENT_ID"
          -p:OAuthGoogleClientSecret="$env:OAUTH_GOOGLE_CLIENT_SECRET"
          -p:OAuthMicrosoftClientId="$env:OAUTH_MICROSOFT_CLIENT_ID"

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.161

      # 前の版を取得して差分更新パッケージを作る（初回は前の版がないため失敗してよい）
      - name: Download previous release
        continue-on-error: true
        run: vpk download github --repoUrl ${{ env.REPO_URL }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack
        run: >
          vpk pack
          --packId Hayabumi
          --packVersion ${{ env.VERSION }}
          --packDir publish
          --mainExe Hayabumi.exe
          --packTitle Hayabumi
          --packAuthors Hayabumi
          --runtime win-x64

      - name: Upload to GitHub Releases
        run: >
          vpk upload github
          --repoUrl ${{ env.REPO_URL }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --releaseName "Hayabumi ${{ env.VERSION }}"
          --tag v${{ env.VERSION }}
          --targetCommitish ${{ github.sha }}
