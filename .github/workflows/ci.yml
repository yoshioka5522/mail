name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test tests/Hayabumi.Core.Tests -c Release --no-build

      - name: Publish (portable)
        run: dotnet publish src/Hayabumi.App -c Release -o publish

      # 画面の確認: サンプルデータで起動して画面を保存する（起動時のエラーもここで分かる）
      - name: UI screenshot
        shell: pwsh
        run: |
          $env:HAYABUMI_DATA_ROOT = Join-Path $env:RUNNER_TEMP "hb-demo"
          $shots = Join-Path $env:RUNNER_TEMP "shots"
          New-Item -ItemType Directory -Force $shots | Out-Null
          $p = Start-Process -FilePath "publish\Hayabumi.exe" -ArgumentList "--demo","--screenshot",(Join-Path $shots "main.png") -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Warning "画面の保存が時間内に終わりませんでした" }
          Copy-Item (Join-Path $env:HAYABUMI_DATA_ROOT "logs\*") $shots -ErrorAction SilentlyContinue
          Get-ChildItem $shots
          if (-not (Test-Path (Join-Path $shots "main.png"))) { throw "画面を保存できませんでした（起動時のエラーの可能性があります）" }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.sha }}
          path: ${{ runner.temp }}/shots
          retention-days: 14

      # 開発環境から画面を確認できるよう、確認用のプレリリースにも置く（自動更新の対象にはならない）
      - name: Publish screenshots to prerelease
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $shots = Join-Path $env:RUNNER_TEMP "shots"
          gh release view ci-screenshots 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create ci-screenshots --prerelease --title "画面の確認用（自動）" --notes "CI が保存した画面です。インストール用ではありません。" --target $env:GITHUB_SHA
          }
          gh release upload ci-screenshots (Get-ChildItem $shots -Filter *.png).FullName --clobber

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: Hayabumi-portable-${{ github.sha }}
          path: publish
          retention-days: 14
